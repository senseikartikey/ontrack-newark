name: Ingest live data

# Every 5 minutes -- not the 60-120s the plan describes as ideal for a dedicated
# worker, because GitHub Actions cron has no finer granularity and (on a private
# repo) each run burns from the free 2000 min/month Actions quota. This repo
# should stay public (it's a portfolio project anyway) so Actions minutes are
# unlimited and a tighter interval becomes possible later -- see /infra/README.md.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Poll weather
        working-directory: ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEATHER_USER_AGENT: ${{ secrets.WEATHER_USER_AGENT }}
        run: python poll_weather.py

      - name: Poll NJ Transit GTFS-RT
        working-directory: ingestion
        # Verified working against the real API on 2026-08-01 -- see
        # ENGINEERING_LOG.md and njt_client.py's docstring for the confirmed
        # request/response shapes. No longer expected to fail.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NJT_USERNAME: ${{ secrets.NJT_USERNAME }}
          NJT_PASSWORD: ${{ secrets.NJT_PASSWORD }}
        run: python poll_gtfs_rt.py

